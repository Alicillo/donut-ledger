<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="emeraldShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Isometric Emerald Block -->
  <g filter="url(#emeraldShadow)">
    <!-- Top Face -->
    <polygon points="32,6 58,19 32,32 6,19" fill="#10b981"/>
    <!-- Top Inner Facet Bevel -->
    <polygon points="32,10 52,20 32,29 12,20" fill="#34d399"/>
    <polygon points="32,14 46,20 32,26 18,20" fill="#6ee7b7"/>

    <!-- Left Face -->
    <polygon points="6,19 32,32 32,58 6,45" fill="#047857"/>
    <!-- Left Face Bevel -->
    <polygon points="10,24 28,33 28,52 10,43" fill="#059669"/>
    <polygon points="14,29 25,35 25,48 14,42" fill="#10b981"/>

    <!-- Right Face -->
    <polygon points="32,32 58,19 58,45 32,58" fill="#064e3b"/>
    <!-- Right Face Bevel -->
    <polygon points="36,33 54,24 54,43 36,52" fill="#047857"/>
    <polygon points="39,35 50,29 50,42 39,48" fill="#059669"/>

    <!-- Sparkle Highlights -->
    <circle cx="32" cy="19" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="20" cy="34" r="1.5" fill="#a7f3d0" opacity="0.9"/>
  </g>
</svg>
