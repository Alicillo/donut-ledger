<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="redstoneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Redstone Dust Cross / Pile -->
  <g filter="url(#redstoneGlow)">
    <!-- Central Cluster -->
    <rect x="26" y="26" width="12" height="12" fill="#dc2626"/>
    <rect x="28" y="28" width="8" height="8" fill="#ef4444"/>
    <rect x="30" y="30" width="4" height="4" fill="#fca5a5"/>

    <!-- North Line -->
    <rect x="28" y="14" width="8" height="12" fill="#b91c1c"/>
    <rect x="30" y="16" width="4" height="8" fill="#ef4444"/>
    <rect x="26" y="10" width="12" height="4" fill="#991b1b"/>
    <rect x="28" y="6" width="8" height="4" fill="#7f1d1d"/>

    <!-- South Line -->
    <rect x="28" y="38" width="8" height="12" fill="#b91c1c"/>
    <rect x="30" y="40" width="4" height="8" fill="#ef4444"/>
    <rect x="26" y="50" width="12" height="4" fill="#991b1b"/>
    <rect x="28" y="54" width="8" height="4" fill="#7f1d1d"/>

    <!-- West Line -->
    <rect x="14" y="28" width="12" height="8" fill="#b91c1c"/>
    <rect x="16" y="30" width="8" height="4" fill="#ef4444"/>
    <rect x="10" y="26" width="4" height="12" fill="#991b1b"/>
    <rect x="6" y="28" width="4" height="8" fill="#7f1d1d"/>

    <!-- East Line -->
    <rect x="38" y="28" width="12" height="8" fill="#b91c1c"/>
    <rect x="40" y="30" width="8" height="4" fill="#ef4444"/>
    <rect x="50" y="26" width="4" height="12" fill="#991b1b"/>
    <rect x="54" y="28" width="4" height="8" fill="#7f1d1d"/>

    <!-- Glowing Sparks / Particles -->
    <rect x="14" y="16" width="4" height="4" fill="#ef4444"/>
    <rect x="46" y="14" width="4" height="4" fill="#f87171"/>
    <rect x="16" y="44" width="4" height="4" fill="#ef4444"/>
    <rect x="44" y="46" width="4" height="4" fill="#fca5a5"/>
    <circle cx="20" cy="18" r="1.5" fill="#fff"/>
    <circle cx="48" cy="48" r="1.5" fill="#fff"/>
  </g>
</svg>
