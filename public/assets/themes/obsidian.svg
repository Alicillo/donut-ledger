<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="blockShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Isometric Obsidian Block -->
  <g filter="url(#blockShadow)">
    <!-- Top Face -->
    <polygon points="32,6 58,19 32,32 6,19" fill="#1b122c"/>
    <polygon points="32,6 58,19 32,32 6,19" fill="none" stroke="#2a1b44" stroke-width="0.5"/>
    <!-- Right Face -->
    <polygon points="32,32 58,19 58,45 32,58" fill="#100b1a"/>
    <!-- Left Face -->
    <polygon points="6,19 32,32 32,58 6,45" fill="#150e24"/>
    
    <!-- Obsidian Purple Veins & Pixel Flecks (Top) -->
    <rect x="22" y="14" width="4" height="4" fill="#6b21a8" opacity="0.8" transform="rotate(25 22 14)"/>
    <rect x="36" y="16" width="3" height="3" fill="#a855f7" opacity="0.9" transform="rotate(25 36 16)"/>
    <rect x="28" y="22" width="4" height="2" fill="#581c87" opacity="0.75" transform="rotate(25 28 22)"/>
    <rect x="42" y="12" width="2" height="2" fill="#c084fc" opacity="0.9"/>

    <!-- Obsidian Purple Veins (Left Face) -->
    <rect x="12" y="27" width="3" height="4" fill="#7e22ce" opacity="0.85"/>
    <rect x="18" y="34" width="4" height="5" fill="#581c87" opacity="0.9"/>
    <rect x="25" y="44" width="3" height="3" fill="#a855f7" opacity="0.85"/>
    <rect x="10" y="38" width="2" height="3" fill="#3b0764" opacity="0.95"/>
    <rect x="22" y="30" width="2" height="2" fill="#c084fc" opacity="0.8"/>

    <!-- Obsidian Purple Veins (Right Face) -->
    <rect x="38" y="35" width="4" height="4" fill="#6b21a8" opacity="0.85"/>
    <rect x="48" y="28" width="3" height="5" fill="#9333ea" opacity="0.9"/>
    <rect x="42" y="46" width="4" height="3" fill="#581c87" opacity="0.9"/>
    <rect x="52" y="38" width="2" height="3" fill="#c084fc" opacity="0.85"/>
    <rect x="36" y="26" width="3" height="2" fill="#3b0764" opacity="0.9"/>
  </g>
</svg>
