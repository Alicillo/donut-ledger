<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="donutDough" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="donutGlaze" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Dough -->
  <circle cx="32" cy="32" r="28" fill="url(#donutDough)" filter="url(#shadow)"/>
  <!-- Pink Frosting / Glaze -->
  <path d="M 32,5 
           C 42,5 57,14 58,28 
           C 59,37 53,42 51,46 
           C 48,52 42,57 33,58 
           C 25,59 18,55 13,50 
           C 7,44 5,36 6,26 
           C 7,16 20,5 32,5 Z" 
        fill="url(#donutGlaze)"/>
  <!-- Donut Hole -->
  <circle cx="32" cy="32" r="10" fill="#0a0915"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#b45309" stroke-width="2.5" opacity="0.6"/>
  <!-- Sprinkles -->
  <line x1="22" y1="14" x2="27" y2="17" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="12" x2="43" y2="15" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="24" x2="52" y2="28" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="39" x2="42" y2="43" stroke="#fbcfe8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="49" x2="33" y2="52" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="40" x2="19" y2="44" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="13" y1="25" x2="18" y2="22" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
</svg>
